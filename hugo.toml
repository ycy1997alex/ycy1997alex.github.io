baseURL = "https://ycy1997alex.github.io/"
title = "Alex Yu 尤俊硯"
theme = "hugo-coder"
defaultContentLanguage = "en"
enableEmoji = true
# front matter 沒寫時區的日期一律當成 +08:00。不設的話 Hugo 當成 UTC，
# 於是當天發的文在台灣時間早上 8 點之前都算未來日期，而 buildFuture 預設
# 是 false，那篇會整篇不建置；CI 跑在 UTC，等於線上直接看不到那篇。
timeZone = "Asia/Taipei"
# 中文逐字計入字數。Hugo 預設按空白切詞，而中文不寫空格，於是一整段中文
# 只會被算成一個詞，WordCount 嚴重低估（本站最長那頁實測 6187 字只算到
# 1031），連帶讓 ReadingTime（= ceil(WordCount / 213)）失真。
hasCJKLanguage = true
# 不產生 front matter aliases 的轉址頁。搬動文章網址時舊連結會直接 404，
# 這是刻意的選擇。實測 disableAliases 只管 renderAliases()，管不到分頁的
# <list>/page/1/（改由 layouts/ 底下不使用 .Paginator 的清單範本解決）
# 與預設語言的 /en/（Hugo 內建，沒有對應開關，唯一留下的轉址頁）。
# static/demo/ 底下那四個轉址頁是靜態檔，不受任何設定影響。
disableAliases = true

[pagination]
pagerSize = 20

# GA4：只在正式 build 注入一次（取代舊站重複兩份的 gtag）
[services]
[services.googleAnalytics]
ID = "G-K1RZ2GLB9K"

[markup]
[markup.highlight]
noClasses = false
[markup.goldmark]
[markup.goldmark.renderer]
# 允許 Markdown 內直接寫 HTML（互動頁 shortcode 需要）
unsafe = true

[taxonomies]
category = "categories"
series = "series"
tag = "tags"
author = "authors"

[params]
# author 同時餵首頁 <h1>、<meta name="author"> 與頭像 alt，中英兩版都要顯示
# "Alex Yu 尤俊硯"，所以不分語言。頁尾的姓名要分語言，改由 copyrightName 提供
# （見 layouts/_partials/footer.html）。
author = "Alex Yu 尤俊硯"
copyrightName = "Alex Yu"
description = "Alex Yu's personal website"
keywords = "blog,developer,personal"
info = [
  "Bio-Medical Algorithm RD & Data and Statistical Analysis",
  "Senior R&D Engineer",
]
# 首頁頭像不走 avatarURL：改由 layouts/_partials/home/avatar.html 覆寫 theme 的
# partial，從 assets/images/fuji-odd-eyed-meow.jpg 產出 400px 的 WebP + JPEG。
# 原圖 1024px/173KB 只會被畫成 200px，直接輸出等於白下載 5 倍像素。
#
# 社群分享預覽圖 (og:image / twitter:image)：人像 + 姓名 + 專長的名片卡，
# 由 tools/make_og_card.py 產生。首頁頭像仍是那隻貓，兩者刻意不同。
images = ["images/og-card.jpg"]
dateFormat = "January 2, 2006"
since = 2023
colorScheme = "auto"
hideColorSchemeToggle = false
maxSeeAlsoItems = 5
# 主題樣式覆寫（在 coder.css 之後載入）
customCSS = ["css/custom.css"]

[[params.social]]
name = "Github"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/ycy1997alex"

[[params.social]]
name = "LinkedIn"
icon = "fa-brands fa-linkedin fa-2x"
weight = 2
url = "https://www.linkedin.com/in/chunyenyu1997/"

# Font Awesome 6 Free 沒有 Gmail 的品牌 glyph（fa-brands 只到 fa-google），
# 所以信箱用 fa-solid 的信封。
[[params.social]]
name = "Email"
icon = "fa-solid fa-envelope fa-2x"
weight = 3
url = "mailto:ycy1997alex@gmail.com"

