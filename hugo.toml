baseURL = "https://ycy1997alex.github.io/"
title = "Alex Yu"
theme = "hugo-coder"
defaultContentLanguage = "en"
enableEmoji = true

[pagination]
pagerSize = 20

# GA4：只在正式 build 注入一次（取代舊站重複兩份的 gtag）
[services]
[services.googleAnalytics]
ID = "G-K1RZ2GLB9K"

[markup]
[markup.highlight]
noClasses = false
[markup.goldmark]
[markup.goldmark.renderer]
# 允許 Markdown 內直接寫 HTML（互動頁 shortcode 需要）
unsafe = true

[taxonomies]
category = "categories"
series = "series"
tag = "tags"
author = "authors"

[params]
