function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function decrypt(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
  return new TextDecoder().decode(buf);
}
const pwEl=document.getElementById('pw'),errEl=document.getElementById('err');
async function submit(){
  errEl.textContent='';
  try{
    const html=await decrypt(pwEl.value);
    const f=document.createElement('iframe');
    document.body.innerHTML='';document.body.appendChild(f);f.srcdoc=html;
  }catch(e){errEl.textContent='密碼錯誤，請再試一次';pwEl.value='';pwEl.focus();}
}
document.getElementById('go').addEventListener('click',submit);
pwEl.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
pwEl.focus();
