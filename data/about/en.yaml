summary:
  title: "Professional Summary"
  intro: "Hello, I'm Alex! I'm outgoing, easy to talk to, good to work with and careful in how I get things done. I like learning new things and picking up new tools, and I think work should rest on evidence and on what the market actually needs."
  points:
    - "Proficient in Python, MATLAB, R and C with over 10 years of programming experience; fluent with standard office software; developed algorithms and software for biomedical and medical-device applications, and previously worked as a firmware engineer in the memory industry."
    - "In industry, focused on innovative healthcare service development, algorithms for new medical devices, and biomedical market and regulatory affairs. Contributed to the business model for an internal EEG-related application, developed a rapid sleep-screening algorithm for an internal sleep-monitoring application, and led clinical-trial data collection to support fasting and dynamic blood-glucose algorithms for a high-precision non-invasive continuous glucose monitoring wearable (Ministry of Economic Affairs A+ Program)."
    - "M.S. in Brain Science (Neuroengineering and Informatics) from NYCU, with experience in intelligent-medicine algorithm development and big-data analysis; specialised in physiological signal analysis, nonlinear science and medical AI, studying the Hilbert-Huang Transform under Prof. Albert Chih-Chieh Yang and Academician Norden E. Huang. B.Eng. in Aeronautics and Astronautics from NCKU with a double major in Psychology (B.S.), with experience in optimisation algorithms and image recognition and a working knowledge of multivariate statistics and neural networks; undergraduate thesis advised by Prof. Chao-Chung Peng."

