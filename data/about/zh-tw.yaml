autobiography:
  title: "自傳"
  items:
    - title: "家庭背景"
      paragraphs:
        - "從小生長在鄉村氣息濃厚的宜蘭溪北，小學課後的活動是放紙船、射紙飛機、騎腳踏車、抓蝴蝶與觀察各式各樣的動物，對各種事物都充滿著好奇心，家庭教育讓我學會了努力奮鬥的價值觀。"
    - eyebrow: "大學時期"
      title: "航太系雙主修心理系、跨領域學習、擔任學生組織幹部"
      paragraphs:
        - "就讀國立成功大學期間，我體會到跨領域的重要，因此除主修航太工程外，也選了心理學系，一個廣泛應用統計學的領域。航太系的目標是培養學生具備設計飛機的能力，因此學習了傳統力學和高速機械運作知識，並修習了與飛機設計相關的課程，以培養扎實且廣泛的工程能力和協作溝通能力。在大二期間，擔任航太系副系會長一職，負責整合和修改系會章程，並領導部分部門執行涉外業務，這鍛鍊了我的領導和溝通能力。"
        - "於心理學系的學習過程中，對臨床心理學和行為科學統計產生濃厚的興趣，修習了統計學門的多變量分析課程，希望能將這些知識應用在更廣泛的領域中。此外，正值人工智慧蓬勃發展的階段，有幸在心理系修課過程接觸具前瞻性的人工智慧專題內容，並將相關知識應用在航太系的專題論文中。"
    - title: "跨領域能力與整合"
      paragraphs:
        - "對臨床心理學的熱愛讓我接觸了許多精神醫學知識，航太系的專題論文使我熟悉了影像辨識、最佳化程式碼的撰寫，並學會串接 AI/ML 介面，我無時無刻思考如何將不同領域的經驗整合。在這樣的背景下，腦科所的神經資訊工程組提供了理想的平台，能藉由融合不同領域經驗，精進分析方法學。碩士就讀期間，我有幸遇到楊智傑教授，他同時是精神科醫師、科學家、工程師，讓我更深入了解醫學、科學、工程之間的交集，這段經歷拓寬了我的視野，也讓我對跨領域整合與多元發展更有信心。"
    - eyebrow: "研究所時期"
      title: "腦科學研究所、黃鍔院士的啟示與非線性科學"
      paragraphs:
        - "碩士期間，學習思覺失調症、生理訊號、時頻分析方法學、醫學影像、機器學習與深度學習之相關知識。在碩士論文中，透過黃鍔院士所發展的非傳統時頻分析方法「希爾伯特-黃轉換（Hilbert-Huang Transform）」，將思覺失調症與健康族群的功能性磁振造影血氧相依水準進行分解，再藉由非線性的相位分析技術與無母數統計方法進行全腦腦區連結的分析，接著以現有臨床量表分數與腦區連結的相位指標做迴歸分析，以量化特定行為表徵對精神疾病問題的影響程度，這項前瞻性研究結果對未來的深層腦刺激治療方法具有潛在價值。研究所期間對方法學的深入研究，包含醫療人工智慧應用的個人專案，提供了我巨大的成長和學習機會。"
        - "一次與黃鍔院士的對談讓我理解到，跨領域人才在建立方法學上有優勢，不同角度的碰撞能帶來進步與創新。我會繼續借鑑各領域的方法論，跳出慣性思維，找新的解法。"
    - eyebrow: "工作經驗"
      title: "生醫訊號演算法、電子產業與醫療、人工智慧／大型語言模型"
      paragraphs:
        - "在目前的職涯發展中，生醫科技為我所接觸時間最長且身處該領域最久，從代理銷售醫療重型設備暨提供與腦健康相關醫療服務，再到具前瞻思維、挑戰非侵入式量測的聖杯（血糖檢測），台灣的生醫產業資源完全不如半導體產業、電子產業，所以在這些工作中，經常一人身兼多職，因此也培養了自我獨立與換位思考的能力。作為研發人員，我負責用統計方法分析數據與撰寫演算法程式碼，為了獲取數據，也依臨床需求撰寫蒐集訊號與數據的應用程式；為了系統整合，我必須對韌體有基本掌握，並能夠串接軟韌體及應用程式介面；同時，我也負責規劃流程、處理部分專案管理項目，並對生醫產業的法律規範與品質系統有所了解。"
        - "但做著做著我發現，自己每天接觸的就是數據、視覺化與統計分析，這些不只生醫產業需要，其他產業也需要。例如在音訊演算法中，透過實驗數據積累去調音，讓手機在播放聲音時的表現更平衡，符合人耳對 ILD、ITD 的聽覺需求；又或是在 SiC 製程中的製程參數調校最佳化，透過不同批次與製程參數的資料積累，從中挖出應該要被控制或調控的變項。"
        - "現在處理資料、寫程式碼，已經不是 3 年前以手刻為主的年代，工作上必須熟悉 AI 工具。我也涉獵 AI 對齊與 AI 駕馭工程，把相關規則與技巧實際用在工作環境中，並在工作之餘撰寫公開文章，記錄我的使用歷程。"
