summary:
  title: "個人簡介"
  intro: "Hello, I'm Alex！我的性格開朗、樂於溝通與團隊合作、行事細心謹慎，我樂於學習新的知識、使用新的工具，我認為工作應實事求是、符合市場需求。"
  points:
    - "熟悉程式語言包含 Python、MATLAB、R、C，具有超過 10 年的程式開發經驗，熟稔各式辦公軟體，曾參與生醫、醫材應用的演算法與軟體研發，也擔任過記憶體產業的韌體工程師。"
    - "進入業界後，著重在醫療創新服務開發、新醫材演算法研發、生醫市場與法規，參與研究「腦波相關應用（內部專案）」的商業模式，參與開發「睡眠檢測應用（內部專案）」的睡眠快速篩檢演算法、「高精度非侵入式連續血糖檢測穿戴裝置技術開發（經濟部 A+ 計畫）」的臨床試驗資料蒐集以實現空腹血糖與血糖變化演算法。"
    - "碩士畢業於陽明交大腦科所工程資訊組，具智慧醫療演算法開發、大數據分析等經驗，擅長生理訊號分析、非線性科學和醫療人工智慧；師承楊智傑教授及黃鍔院士，鑽研「希爾伯特-黃轉換」訊號分析技術。大學畢業於成大航太系、雙主修心理系，具最佳化演算法、影像辨識經驗，熟悉統計多變量分析、神經網路應用；專題師承航太系彭兆仲教授。"

