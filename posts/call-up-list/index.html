<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>教召令攜帶物品清單 · Alex Yu</title>
<meta name="description" content="教召令攜帶物品確認清單，依穿戴、身上、背包與行李分類勾選。">
<link rel="canonical" href="https://ycy1997alex.github.io/posts/call-up-list/">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f0e8;
    --surface: #fffdf8;
    --border: rgba(90,70,40,.15);
    --text: #2a1f0f;
    --muted: #7a6a55;
    --accent: #8b3a1a;
    --accent2: #4a6741;
    --soft: rgba(139,58,26,.1);
    --soft2: rgba(74,103,65,.12);
    --stripe: rgba(139,58,26,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1510;
      --surface: #231e17;
      --border: rgba(200,180,140,.12);
      --text: #ede5d8;
      --muted: #a09080;
      --accent: #d4724a;
      --accent2: #7aaa6a;
      --soft: rgba(212,114,74,.12);
      --soft2: rgba(122,170,106,.12);
      --stripe: rgba(212,114,74,.04);
    }
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  .page { max-width: 680px; margin: 0 auto; }

  /* ── Hero ── */
  .hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem 1.5rem 1.6rem;
    margin-bottom: 1.4rem;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(90,60,20,.07);
  }
  .hero::before {
    content: '🪖';
    position: absolute;
    right: 1.4rem; top: 1.2rem;
    font-size: 3.5rem;
    opacity: .15;
    pointer-events: none;
  }
  .hero-label {
    font-family: 'Noto Serif TC', serif;
    font-size: .85rem;
    letter-spacing: .18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: .5rem;
  }
  .hero h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: .5rem;
  }
  .hero-desc { color: var(--muted); font-size: .95rem; line-height: 1.6; }

  /* ── Stats ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: .75rem;
    margin-top: 1.2rem;
  }
  @media (min-width: 480px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat {
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: .75rem .9rem;
  }
  .stat span { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .2rem; }
  .stat strong { font-size: 1.25rem; font-weight: 700; }

  /* ── Progress ── */
  .progress-row {
    display: flex; align-items: center; gap: .85rem;
    margin: 1.2rem 0 .6rem;
  }
  .bar {
    flex: 1; height: 8px; background: var(--soft);
    border-radius: 999px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 999px;
    transition: width .35s ease;
  }
  .progress-count { font-weight: 700; font-size: 1rem; white-space: nowrap; }

  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.4rem;
  }
  .toolbar-hint { font-size: .85rem; color: var(--muted); }
  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    cursor: pointer;
    font-size: .85rem;
    font-family: inherit;
    padding: .4rem .9rem;
    transition: border-color .2s, color .2s;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Section ── */
  .section { margin-bottom: 1.8rem; }
  .section-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
    border-left: 3px solid var(--accent);
    padding-left: .65rem;
    margin-bottom: .75rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .section-title.green {
    color: var(--accent2);
    border-left-color: var(--accent2);
  }

  /* Sub-group (巢狀包包) */
  .sub-group {
    background: var(--stripe);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: .65rem .75rem .45rem;
    margin-bottom: .6rem;
  }
  .sub-title {
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: .4rem;
    padding-left: .1rem;
  }

  /* ── Checklist items ── */
  .checks { display: grid; gap: .5rem; }
  .check {
    display: flex;
    align-items: center;
    gap: .75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .7rem .9rem;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .check:hover { border-color: var(--accent); }
  .check input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 1.3rem; height: 1.3rem;
    border: 2px solid var(--border);
    border-radius: 5px;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    transition: background .15s, border-color .15s;
  }
  .check input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 3px; top: 1px;
    width: 6px; height: 10px;
    border: 2px solid #fff;
    border-top: none; border-left: none;
    transform: rotate(40deg);
  }
  .check span { font-size: .95rem; line-height: 1.4; }
  .check.done { background: var(--stripe); }
  .check.done span { color: var(--muted); text-decoration: line-through; }

  /* sub-group 裡的 check 背景略暗 */
  .sub-group .check { background: var(--bg); }
  .sub-group .check.done { opacity: .7; }

  .note {
    font-size: .85rem;
    color: var(--muted);
    margin-top: 1.4rem;
    text-align: center;
    padding-bottom: .5rem;
  }
</style>
</head>

<script>
(function () {
  var STORAGE_KEY = 'jiaozhaoPacking';
  var groups = { wear: 'stat-wear', body: 'stat-body', bag: 'stat-bag', luggage: 'stat-luggage' };
  var labels = document.querySelectorAll('[data-id]');
  var state = {};

  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) { state = {}; }

  function refresh() {
    var total = labels.length, checked = 0;
    var gc = {}, gt = {};
    labels.forEach(function (lbl) {
      var id = lbl.getAttribute('data-id');
      var g = lbl.getAttribute('data-group');
      var box = lbl.querySelector('input');
      var on = !!state[id];
      box.checked = on;
      lbl.classList.toggle('done', on);
      if (on) { checked++; gc[g] = (gc[g] || 0) + 1; }
      gt[g] = (gt[g] || 0) + 1;
    });
    document.getElementById('prog-count').textContent = checked + ' / ' + total;
    document.getElementById('bar-fill').style.width = ((checked / Math.max(total, 1)) * 100) + '%';
    Object.keys(groups).forEach(function (g) {
      var el = document.getElementById(groups[g]);
      if (el) el.textContent = (gc[g] || 0) + '/' + (gt[g] || 0);
    });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  labels.forEach(function (lbl) {
    lbl.querySelector('input').addEventListener('change', function () {
      state[lbl.getAttribute('data-id')] = this.checked;
      refresh();
    });
  });

  document.getElementById('reset-btn').addEventListener('click', function () {
    state = {}; refresh();
  });

  refresh();
}());
</script>
